name: Mouse Bridge Remapper CI

on:
  pull_request:
  push:
    branches:
      - main
      - "mbr/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-architecture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure host build
        run: >-
          cmake -S . -B build-host
          -DMBR_BUILD_PICO=OFF
          -DMBR_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build host scaffold and tests
        run: cmake --build build-host --parallel

      - name: Run host and architecture tests
        run: ctest --test-dir build-host --output-on-failure

  pico2-w-production:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned ARM toolchain
        shell: bash
        run: |
          set -euo pipefail
          source ci/toolchain.env
          sudo apt-get update
          sudo apt-get install -y \
            "gcc-arm-none-eabi=${ARM_GCC_PACKAGE_VERSION}" \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib
          test "$(dpkg-query -W -f='${Version}' gcc-arm-none-eabi)" = "${ARM_GCC_PACKAGE_VERSION}"
          arm-none-eabi-gcc --version | head -n 1

      - name: Fetch pinned Pico SDK
        shell: bash
        run: |
          set -euo pipefail
          source ci/toolchain.env
          git clone --depth 1 --branch "${PICO_SDK_VERSION}" \
            https://github.com/raspberrypi/pico-sdk.git "${RUNNER_TEMP}/pico-sdk"
          git -C "${RUNNER_TEMP}/pico-sdk" submodule update --init --depth 1
          test "$(git -C "${RUNNER_TEMP}/pico-sdk" describe --tags --exact-match)" = "${PICO_SDK_VERSION}"

      - name: Configure Pico 2 W production scaffold
        shell: bash
        run: |
          set -euo pipefail
          export PICO_SDK_PATH="${RUNNER_TEMP}/pico-sdk"
          cmake -S . -B build-pico \
            -DMBR_BUILD_PICO=ON \
            -DMBR_BUILD_USB_HID_QUALIFICATION=ON \
            -DMBR_BUILD_TESTS=OFF \
            -DPICO_BOARD=pico2_w \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Pico 2 W production and MBR-04 USB HID qualification firmware
        run: cmake --build build-pico --parallel

      - name: Verify non-empty MBR-04 UF2s
        run: |
          test -s build-pico/mouse_bridge_remapper.uf2
          test -s build-pico/mbr_usb_hid_qualification.uf2
          sha256sum build-pico/mouse_bridge_remapper.uf2 build-pico/mbr_usb_hid_qualification.uf2
          wc -c build-pico/mouse_bridge_remapper.uf2 build-pico/mbr_usb_hid_qualification.uf2

      - name: Upload MBR-03 UF2s
        uses: actions/upload-artifact@v4
        with:
          name: mbr-04-pico2w-usb-hid-uf2
          path: |
            build-pico/mouse_bridge_remapper.uf2
            build-pico/mbr_usb_hid_qualification.uf2
          if-no-files-found: error
